<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias - LACID</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="icon" href="img/logoLACID.webp" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="src/js/main.js" type="module" defer></script>
    <script src="src/js/news.js" type="module" defer></script>
</head>
<body>

    <header class="header-noticias">
        <div class="breadcrumb">
            <a href="index.html" aria-label="Página Inicial" class="icone-home">
                <i class="bi bi-house-door-fill"></i>
            </a>
        </div>
        <h1 class="titulo-pagina">NOTÍCIAS</h1>
    </header>

    <div class="layout-duas-colunas">

        <main class="coluna-lista" data-news-list></main>

        <aside class="coluna-filtros">
            
            <div class="busca-container">
                <input type="text" placeholder="Buscar notícia..." class="input-busca">
                <button type="button" class="btn-busca"><i class="bi bi-search"></i></button>
            </div>

            <div class="calendario-container">
                <h3 class="titulo-filtro">Filtrar por data</h3>
                
                <div class="calendario-box">
                    <div class="calendario-header">
                        <button class="btn-mes" id="prev-mes"><i class="bi bi-chevron-left"></i></button>
                        <span class="nome-mes" id="mes-atual">Maio 2026</span>
                        <button class="btn-mes" id="next-mes"><i class="bi bi-chevron-right"></i></button>
                    </div>
                    <table class="tabela-mes">
                        <thead>
                            <tr>
                                <th>D</th><th>S</th><th>T</th><th>Q</th><th>Q</th><th>S</th><th>S</th>
                            </tr>
                        </thead>
                        <tbody id="calendario-corpo">
                            <!-- Gerado dinamicamente via JS -->
                        </tbody>
                    </table>
                </div>
                <button class="btn-limpar-filtros">
                    <i class="bi bi-x-circle"></i> Limpar Filtros
                </button>
            </div>

        </aside>

    </div>
</body>
</html>
